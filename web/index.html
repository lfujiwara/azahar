<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Azahar Web</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 13px monospace; }
  canvas { display: block; margin: 0 auto; background: #000; }
  #log { white-space: pre-wrap; height: 30vh; overflow: auto; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="canvas" width="400" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">loading…</div>
<div id="picker" hidden>
  <label>Load a decrypted .3ds / .cci / .cxi / .cia / .3dsx / .elf: <input type="file" id="file"></label>
  <span id="saved"></span>
</div>
<div id="log"></div>
<script>
  const params = new URLSearchParams(location.search);
  // ?rom=<url> fetches a ROM; ?rom=idb/<name> boots one saved in browser storage; no ?rom shows the picker.
  const rom = params.get("rom");
  const logEl = document.getElementById("log");
  window.azaharLog = [];
  const log = (s) => {
    window.azaharLog.push(s);
    console.log(s);
    if (window.azaharLog.length < 2000) logEl.textContent += s + "\n";
  };
  var Module = {
    canvas: document.getElementById("canvas"),
    print: log,
    printErr: log,
    setStatus: (s) => (document.getElementById("status").textContent = s),
    async onRuntimeInitialized() {
      // Emulator user data (config, NAND, SDMC, saves) persists in IndexedDB.
      const home = "/home/web_user";
      FS.mkdirTree(home);
      FS.mount(IDBFS, {}, home);
      await new Promise((ok) => FS.syncfs(true, ok));
      const count = (dir) => {
        let n = 0;
        for (const e of FS.readdir(dir)) {
          if (e === "." || e === "..") continue;
          const p = dir + "/" + e;
          n += FS.isDir(FS.stat(p).mode) ? count(p) : 1;
        }
        return n;
      };
      log(`[web] persisted files: ${count(home)}`);
      // ?sdmc=3ds/app/data.bin,...: copy files from web/sdmc/ onto the emulated SD card (if missing)
      for (const rel of (params.get("sdmc") || "").split(",").filter(Boolean)) {
        const dst = home + "/.local/share/azahar-emu/sdmc/" + rel;
        if (FS.analyzePath(dst).exists) continue;
        const data = new Uint8Array(await (await fetch("sdmc/" + rel)).arrayBuffer());
        FS.mkdirTree(dst.slice(0, dst.lastIndexOf("/")));
        FS.writeFile(dst, data);
        log(`[web] sdmc ${rel} (${data.length} bytes)`);
      }
      // libctru's ndspInit refuses to start without a DSP firmware file; HLE audio ignores its contents.
      const dspfirm = home + "/.local/share/azahar-emu/sdmc/3ds/dspfirm.cdc";
      if (!FS.analyzePath(dspfirm).exists) {
        FS.mkdirTree(dspfirm.slice(0, dspfirm.lastIndexOf("/")));
        FS.writeFile(dspfirm, new Uint8Array(0x300));
      }
      let syncing = false;
      window.azaharSync = () =>
        new Promise((ok) => {
          if (syncing) return ok();
          syncing = true;
          FS.syncfs(false, () => ((syncing = false), ok()));
        });
      setInterval(window.azaharSync, 5000);
      addEventListener("pagehide", window.azaharSync);
      const saved = home + "/roms";
      FS.mkdirTree(saved);
      if (!rom) {
        document.getElementById("picker").hidden = false;
        document.getElementById("status").textContent = "pick a ROM";
        document.getElementById("saved").innerHTML = FS.readdir(saved)
          .filter((n) => !n.startsWith("."))
          .map((n) => `<a href="?rom=idb/${encodeURIComponent(n)}">${n}</a>`)
          .join(" ");
        document.getElementById("file").onchange = async (e) => {
          const f = e.target.files[0];
          FS.writeFile(`${saved}/${f.name}`, new Uint8Array(await f.arrayBuffer()));
          await window.azaharSync();
          location.search = "?rom=idb/" + encodeURIComponent(f.name);
        };
        return;
      }
      let name;
      if (rom.startsWith("idb/")) {
        name = `${saved}/${rom.slice(4)}`;
      } else {
        const buf = new Uint8Array(await (await fetch(rom)).arrayBuffer());
        name = "/roms/" + rom.split("/").pop();
        FS.mkdirTree("/roms");
        FS.writeFile(name, buf);
        log(`[web] wrote ${name} (${buf.length} bytes)`);
      }
      // ?set=Renderer.graphics_api=0,Core.use_cpu_jit=0 -> sdl2-config.ini overrides
      const sections = {};
      // WebGL2 renderer by default; Renderer.graphics_api=0 selects the software renderer.
      const overrides = ["Renderer.graphics_api=1", ...(params.get("set") || "").split(",")];
      for (const kv of overrides.filter(Boolean)) {
        const [path, value] = kv.split("=");
        const [sec, key] = path.split(".");
        (sections[sec] ||= {})[key] = value;
      }
      const ini = Object.entries(sections)
        .map(([k, v]) => `[${k}]\n` + Object.entries(v).map(([a, b]) => `${a} = ${b}`).join("\n"))
        .join("\n");
      if (ini) {
        FS.mkdirTree("/home/web_user/.config/azahar-emu");
        FS.writeFile("/home/web_user/.config/azahar-emu/sdl2-config.ini", ini + "\n");
        log("[web] ini:\n" + ini);
      }
      if (params.get("stopAt")) ENV.AZAHAR_STOP_AT = params.get("stopAt");
      const extra = (params.get("args") || "").split(" ").filter(Boolean);
      Module.callMain([...extra, name]);
    },
  };
</script>
<script src="out/azahar.js"></script>
</body>
</html>
